name: Release

# Builds every platform when a version tag (v*) is pushed, then attaches the
# installers to that tag's GitHub release (created if it doesn't exist).
# Run it by hand for an existing tag from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v1.2.1)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            platform: macos
          - name: Windows x64
            os: windows-latest
            platform: windows
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            pkg-config build-essential file rpm patchelf

      - name: Build (macOS / Linux)
        if: matrix.platform != 'windows'
        run: ./build-release.sh

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./build-release.ps1

      # Stable file names so README links to releases/latest/download keep working.
      - name: Rename artifacts
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.platform }}" in
            macos)
              cp Release/macos/*.dmg "dist/DJI-Mic-Control_macOS_arm64.dmg" ;;
            windows)
              cp Release/windows/*-setup.exe "dist/DJI-Mic-Control_Windows_x64_setup.exe"
              cp "Release/windows/DJI Mic Control.exe" "dist/DJI-Mic-Control_Windows_x64_portable.exe" ;;
            linux)
              cp Release/linux/*.deb "dist/DJI-Mic-Control_Linux_amd64.deb"
              cp Release/linux/*.rpm "dist/DJI-Mic-Control_Linux_x86_64.rpm"
              cp Release/linux/*.AppImage "dist/DJI-Mic-Control_Linux_amd64.AppImage" ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "DJI Mic Control ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" * --clobber
