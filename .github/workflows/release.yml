name: Release

# Builds every platform when a version tag (v*) is pushed, then attaches the
# installers to that tag's GitHub release (created if it doesn't exist).
# Run it by hand for an existing tag from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v1.2.1)"
        required: true

permissions:
  contents: write
  actions: read # SignPath fetches the artifacts to sign with the job's token

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            platform: macos
          - name: Windows x64
            os: windows-latest
            platform: windows
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            libdbus-1-dev pkg-config build-essential file rpm patchelf

      # Signed and notarized when the Apple secrets are configured (see
      # docs/macos-signing.md); unsigned otherwise.
      - name: Build (macOS)
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          fi
          unset APPLE_API_KEY_P8
          ./build-release.sh

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: ./build-release.sh

      # Windows: compile, sign the exe, package that signed exe into the
      # installer, sign the installer. Signing goes through SignPath and runs
      # when the SIGNPATH_ORGANIZATION_ID variable is set (see
      # docs/windows-signing.md); unsigned otherwise. Each signing request
      # waits for someone to approve it in SignPath.
      - name: Compile (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./build-release.ps1 -Step compile

      - name: Version to sign (Windows)
        id: version
        if: matrix.platform == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $v = (Get-Content gui/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Upload the exe for signing
        id: unsigned-exe
        if: steps.version.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: target/release/djimic-gui.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the exe
        if: steps.unsigned-exe.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/exe

      - name: Use the signed exe
        if: steps.unsigned-exe.outcome == 'success'
        shell: pwsh
        run: Copy-Item signed/exe/djimic-gui.exe target/release/djimic-gui.exe -Force

      - name: Bundle (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./build-release.ps1 -Step bundle

      - name: Upload the installer for signing
        id: unsigned-setup
        if: steps.unsigned-exe.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: Release/windows/*-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer
        if: steps.unsigned-setup.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/setup

      - name: Use the signed installer
        if: steps.unsigned-setup.outcome == 'success'
        shell: pwsh
        run: |
          Copy-Item signed/setup/*-setup.exe Release/windows/ -Force
          ./build-release.ps1 -Step verify

      # Stable file names so README links to releases/latest/download keep working.
      - name: Rename artifacts
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.platform }}" in
            macos)
              cp Release/macos/*.dmg "dist/DJI-Mic-Control_macOS_arm64.dmg" ;;
            windows)
              cp Release/windows/*-setup.exe "dist/DJI-Mic-Control_Windows_x64_setup.exe"
              cp "Release/windows/DJI Mic Control.exe" "dist/DJI-Mic-Control_Windows_x64_portable.exe" ;;
            linux)
              cp Release/linux/*.deb "dist/DJI-Mic-Control_Linux_amd64.deb"
              cp Release/linux/*.rpm "dist/DJI-Mic-Control_Linux_x86_64.rpm"
              cp Release/linux/*.AppImage "dist/DJI-Mic-Control_Linux_amd64.AppImage" ;;
          esac
          ls -l dist

      # "release-" prefix: publish only downloads these, not the unsigned
      # files uploaded for signing.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber
          else
            # Given the files, gh creates the release as a draft, uploads them
            # and only then publishes it, so it never becomes "latest" without
            # them: releases/latest/download/<name> (which miccontrol.app
            # redirects to) keeps serving the previous version until then.
            # Notes: GitHub's generated changelog, then links to the website's
            # setup guides (kept outside dist/ so they aren't uploaded).
            notes="$RUNNER_TEMP/notes.md"
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > "$notes"
            printf '\n---\n\nNew here? Setup guide: https://miccontrol.app/en/dji-mic-3-mac/ · Troubleshooting: https://miccontrol.app/en/dji-mic-3-not-recognized-mac/\n' >> "$notes"
            printf '\nCode signing policy: https://github.com/%s/blob/main/docs/code-signing-policy.md\n' "$GH_REPO" >> "$notes"
            gh release create "$TAG" * --title "DJI Mic Control ${TAG#v}" --notes-file "$notes"
          fi

  # Points the Homebrew cask (qubik89/homebrew-tap) at the .dmg just published.
  # Needs a HOMEBREW_TAP_TOKEN secret: a fine-grained token with "Contents:
  # read and write" on qubik89/homebrew-tap only. Without it, this job skips.
  homebrew:
    name: Update Homebrew cask
    needs: publish
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check for the token
        id: token
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then echo "set=1" >> "$GITHUB_OUTPUT"
          else echo "No HOMEBREW_TAP_TOKEN secret: the cask is not updated."; fi

      - if: steps.token.outputs.set == '1'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - if: steps.token.outputs.set == '1'
        uses: actions/checkout@v4
        with:
          repository: qubik89/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - if: steps.token.outputs.set == '1'
        uses: actions/download-artifact@v4
        with:
          pattern: "*macos"   # the build job's macOS artifact
          merge-multiple: true
          path: dist

      - name: Update the cask and push it
        if: steps.token.outputs.set == '1'
        run: |
          ./build-release.sh --update-cask dist/DJI-Mic-Control_macOS_arm64.dmg homebrew-tap
          cd homebrew-tap
          if git diff --quiet; then echo "The cask is already up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "mic-control ${TAG#v}"
          git push
