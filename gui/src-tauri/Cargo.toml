[package]
name = "djimic-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop control app for DJI wireless microphones."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "djimic_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "djimic-gui"
path = "src/main.rs"

[dependencies]
device = { workspace = true }
tauri = { version = "2", features = ["image-png"] }
# Opens the Ko-fi page in the default browser (the URL is fixed in commands.rs).
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }

# Desktop shell only (tray, autostart, single instance).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
signal-hook = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Enabled automatically by `cargo tauri build`; makes the binary serve its
# embedded frontend instead of connecting to the dev server. Do not remove.
custom-protocol = ["tauri/custom-protocol"]
