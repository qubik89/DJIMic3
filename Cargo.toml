[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/device",
    "crates/link",
    "crates/recordings",
    "crates/cli",
    "gui/src-tauri",
]

[workspace.package]
version = "1.7.0"
edition = "2021"
license = "Unlicense"
rust-version = "1.88"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
device = { path = "crates/device" }
recordings = { path = "crates/recordings" }
link = { path = "crates/link" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
nusb = "0.2"
futures-lite = "2"
async-channel = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
lto = "thin"
